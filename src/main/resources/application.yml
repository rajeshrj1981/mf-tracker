spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:mftracker_copy}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update          # tables are created/updated automatically
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${PORT:8080}

mftracker:
  seed-on-empty: false         # clean copy starts without personal investment data
  amfi-url: https://www.amfiindia.com/spages/NAVAll.txt
  mfapi-url: https://api.mfapi.in/mf
  nav-tolerance: 0.15            # auto-match: live NAV must be within 15% of the NAV in your sheet
  auth:
    rajesh-password: ${RAJESH_PASSWORD:rajesh}
    cams-password: ${CAMS_PASSWORD:cams}
  advisor:
    daily-amount: 1000           # rupees suggested per day
    max-weight: 0.10             # skip a fund that is already more than 10% of your portfolio

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}   # optional - enables Claude's written commentary on the daily pick
  model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

gemini:
  api-key: ${GEMINI_API_KEY:}      # optional - enables Gemini email parsing
  model: ${GEMINI_MODEL:gemini-3.8-flash}
